name: Credential-free tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run contract, framework, fixture, and boundary tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  mldsa-native-official-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build pinned portable backend and replay public vectors
        run: make mldsa-native-official-replay
      - name: Run native adapter integration tests
        env:
          PYTHONPATH: src
        run: python -m unittest tests.integration.test_mldsa_native_backend -v
      - name: Verify completion evidence and public export
        env:
          PYTHONPATH: src
        run: |
          python tools/verify_mldsa_completion.py \
            --official-report build/mldsa-native/official-replay.json \
            --report build/mldsa-native/completion-check.json
